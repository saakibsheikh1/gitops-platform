apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-nginx
  namespace: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dev-nginx
  template:
    metadata:
      labels:
        app: dev-nginx
    spec:
      containers:
        - name: nginx
          image: 495278513365.dkr.ecr.ap-south-1.amazonaws.com/cicd-rollback-pipeline:dev-latest
          ports:
            - containerPort: 80