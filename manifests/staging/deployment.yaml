apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-nginx
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: staging-nginx
  template:
    metadata:
      labels:
        app: staging-nginx
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: nginx
          image: 495278513365.dkr.ecr.ap-south-1.amazonaws.com/cicd-rollback-pipeline@sha256:a12c9fbd04261802afc5cb2d8d8d980645dec82cfca86842e3a13f298a680553
          ports:
            - containerPort: 80