apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: production-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/saakibsheikh1/gitops-platform.git
    targetRevision: main
    path: manifests/production

  destination:
    server: https://kubernetes.default.svc
    namespace: production

  syncPolicy:
    syncOptions:
      - CreateNamespace=true