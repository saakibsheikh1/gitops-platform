apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/saakibsheikh1/gitops-platform.git
    targetRevision: main
    path: manifests/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true